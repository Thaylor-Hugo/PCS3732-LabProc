<html>
    <div id="topAlert" class="top-alert"></div>
    <div>
        <h1>Dashboard da Calculadora</h1>
        <div class="operands">
            <p>Operando A: </p>
            <input type="text" placeholder="Digite um número em binário" id="operandA" maxlength="4">
        </div>
        <div class="operands">
            <p>Operando B: </p>
            <input type="text" placeholder="Digite um número em binário" id="operandB" maxlength="4">
        </div>
        <div>
            <button id="add">Adicionar</button>
            <button id="sub">Subtrair</button>
        </div>
    </div>
</html>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    div {
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .operands {
        margin-bottom: 15px;
    }

    input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    button {
        padding: 10px 20px;
        margin-right: 10px;
        border: none;
        border-radius: 4px;
        background-color: #007BFF;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background-color: #0056b3;
    }

    .top-alert {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        display: none;
        padding: 12px 16px;
        text-align: center;
        font-weight: 600;
        color: #fff;
        background-color: #c62828;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .top-alert.show {
        display: block;
    }
</style>

<script>
    function showTopAlert(message) {
        const alertBox = document.getElementById('topAlert');
        alertBox.textContent = message;
        alertBox.classList.add('show');
    }

    function hideTopAlert() {
        document.getElementById('topAlert').classList.remove('show');
    }

    async function sendCalcRequest(op) {
        const a = document.getElementById('operandA').value.trim();
        const b = document.getElementById('operandB').value.trim();

        if (!/^[01]{1,4}$/.test(a) || !/^[01]{1,4}$/.test(b)) {
            alert('Digite apenas numeros binarios de ate 4 bits nos dois operandos.');
            return;
        }

        hideTopAlert();

        const url = `http://192.168.4.1/calc?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}&op=${encodeURIComponent(op)}`;

        try {
            const response = await fetch(url);
            const responseBody = await response.text();
            const normalizedBody = responseBody.toLowerCase();
            const isOverflow = response.status === 400;

            if (!response.ok || isOverflow) {
                if (isOverflow) {
                    showTopAlert('Overflow detectado na operacao.');
                    return;
                }

                showTopAlert(`Erro na requisicao (codigo ${response.status}).`);
            }
        } catch (error) {
            showTopAlert('Falha ao conectar com a calculadora em 192.168.4.1.');
        }
    }

    document.getElementById('add').addEventListener('click', function() {
        sendCalcRequest('add');
    });

    document.getElementById('sub').addEventListener('click', function() {
        sendCalcRequest('sub');
    });
</script>
